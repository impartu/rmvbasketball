<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BucketSquad Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#F0571F; --orange-lit:#FF7A3D; --sky:#6EBAE7; --sky-deep:#3E96D6; --ink:#20160F; --cream:#FFF6EC; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:none}
  body{background:#1A120C;color:var(--cream);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;font-weight:700;display:flex;flex-direction:column;user-select:none}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;touch-action:none}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;pointer-events:none}
  .chip{background:rgba(26,18,12,.78);border:2px solid rgba(255,246,236,.18);border-radius:14px;padding:5px 10px 6px;line-height:1;display:flex;flex-direction:column;gap:3px}
  .chip small{font-size:9px;letter-spacing:.14em;color:#C6A98F;font-weight:900}
  .chip b{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:19px}
  #clock b{color:var(--orange-lit)}
  #streak{margin-left:auto;border-color:rgba(240,87,31,.5)}
  #streak b{font-size:16px}
  #mute,#exit{pointer-events:auto;width:38px;height:38px;border-radius:12px;font-size:17px;line-height:1;
    background:rgba(26,18,12,.78);border:2px solid rgba(255,246,236,.18);color:var(--cream)}
  #mute.off{opacity:.45}
  #exit{font-size:15px;font-weight:900}
  #callout{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:32px;color:#fff;text-shadow:0 4px 0 rgba(32,22,15,.55);opacity:0;pointer-events:none}
  @keyframes pop{0%{opacity:0;transform:scale(.7) translateY(10px)}18%{opacity:1;transform:scale(1.08)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-22px)}}
  #callout.go{animation:pop 1s ease-out forwards}
  #controls{height:150px;flex:none;position:relative;padding:0 14px calc(env(safe-area-inset-bottom) + 6px);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#1A120C,#120C08);border-top:3px solid rgba(240,87,31,.35)}
  #stick{position:relative;width:114px;height:114px;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(110,186,231,.16),rgba(255,255,255,.05));border:3px solid rgba(110,186,231,.4);flex:none}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  #stick:after{content:"MOVE";position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-size:9px;letter-spacing:.2em;color:#7E6A59;font-weight:900}
  #btns{display:flex;align-items:center;gap:12px}
  #pass{width:74px;height:74px;border-radius:50%;border:0;background:radial-gradient(circle at 50% 35%,#7FC6EE,var(--sky-deep) 70%,#22699E);color:#fff;font-family:Bungee,Impact,sans-serif;font-size:13px;box-shadow:0 5px 0 #1B5379}
  #pass:active{transform:translateY(3px);box-shadow:0 2px 0 #1B5379}
  #shootWrap{position:relative;width:114px;height:114px}
  #shoot{position:absolute;inset:0;border-radius:50%;border:0;background:radial-gradient(circle at 50% 35%,var(--orange-lit),var(--orange) 65%,#B93B10);color:#fff;font-family:Bungee,Impact,sans-serif;font-size:16px;box-shadow:0 5px 0 #8E2E0C}
  #shoot:active{transform:translateY(3px);box-shadow:0 2px 0 #8E2E0C}
  button:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
  #meter{position:absolute;inset:-9px;pointer-events:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(18,12,8,.82);backdrop-filter:blur(3px);padding:20px}
  #overlay.hide{display:none}
  .card{width:100%;max-width:330px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;text-align:center;background:var(--cream);color:var(--ink);border-radius:26px;padding:20px 20px 18px;border:5px solid var(--orange);box-shadow:0 14px 0 rgba(0,0,0,.35)}
  .card h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:30px;line-height:.95;margin:0 0 4px;color:var(--orange)}
  .card h1 span{display:block;color:var(--sky-deep);font-size:24px}
  .card p{font-size:14px;line-height:1.5;color:#5A4636;margin:12px 0 14px}
  .card p b{color:var(--ink)}
  .final{font-family:Bungee,Impact,sans-serif;font-size:50px;color:var(--orange);margin:2px 0}
  .sub{font-size:13px;color:#5A4636;margin-bottom:14px}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F0E4D6;border-radius:14px;padding:9px 12px;margin-bottom:12px;font-size:14px}
  .toggle button{border:0;border-radius:10px;padding:7px 14px;font-family:inherit;font-weight:900;font-size:13px;background:#CBB9A6;color:#463526}
  .toggle button.on{background:var(--sky-deep);color:#fff}
  .play{width:100%;border:0;border-radius:16px;padding:14px;font-family:Bungee,Impact,sans-serif;font-size:19px;color:#fff;background:var(--orange);box-shadow:0 5px 0 #8E2E0C}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #8E2E0C}
  #nm{width:100%;border:3px solid #E0CDB8;border-radius:14px;padding:10px 34px 10px 13px;margin:4px 0 10px;
    font-family:inherit;font-weight:900;font-size:15px;color:var(--ink);background:#fff;text-align:center}
  #nm:focus{outline:none;border-color:var(--sky-deep)}
  .play.alt{background:var(--sky-deep);box-shadow:0 5px 0 #1B5379}
  .play.alt:active{box-shadow:0 2px 0 #1B5379}
  .play.az{background:#3E8C56;box-shadow:0 5px 0 #235A34}
  .play.az:active{box-shadow:0 2px 0 #235A34}
  .play.sh{background:#6B4FA0;box-shadow:0 5px 0 #402F60}
  .play.sh:active{box-shadow:0 2px 0 #402F60}
  .play+.hint{font-size:11px;color:#8A7361;margin:4px 0 10px}
  .row{display:flex;gap:10px;margin-top:10px}
  .link{flex:1;border:0;background:#F0E4D6;color:#5A4636;border-radius:12px;padding:10px;
    font-family:inherit;font-weight:900;font-size:13px}
  .tabs{display:flex;gap:8px;margin:12px 0}
  .tab{flex:1;border:0;border-radius:12px;padding:9px;font-family:inherit;font-weight:900;
    font-size:13px;background:#E4D5C4;color:#6B5946}
  .tab.on{background:var(--orange);color:#fff}
  .lb{list-style:none;margin:0 0 14px;padding:0;text-align:left}
  .lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px}
  .lb li:nth-child(odd){background:#F2E7DA}
  .lb .pos{font-family:Bungee,Impact,sans-serif;color:#B08A67;width:20px}
  .lb .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .pts{font-family:Bungee,Impact,sans-serif;color:var(--orange)}
  .lb li:first-child .pts{font-size:18px}
  .lb .empty{color:#8A7361;font-size:13px;justify-content:center}
  .tip{font-size:11px;color:#8A7361;margin-top:11px;line-height:1.5}

  .nmWrap{position:relative}
  .nmWrap .nmChev{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:#B08A67;font-size:12px;pointer-events:none}
  .ballDivider,.tagline{display:flex;align-items:center;gap:10px}
  .ballDivider{margin:8px 0 14px}
  .ballDivider span{flex:1;height:1px;background:#E0CDB8}
  .ballDivider svg{flex:none;width:20px;height:20px;color:var(--orange)}
  .tagline{font-size:10px;letter-spacing:.18em;color:#B08A67;font-weight:900;margin:12px 0;text-transform:uppercase}
  .tagline span{flex:1;height:1px;background:#E0CDB8}
  .modeCard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;
    border-radius:18px;padding:12px 14px;margin-bottom:12px;color:#fff;font-family:inherit}
  .modeCard:active{transform:translateY(3px)}
  .modeCard.game{background:var(--orange);box-shadow:0 5px 0 #8E2E0C}
  .modeCard.game:active{box-shadow:0 2px 0 #8E2E0C}
  .modeCard.three{background:var(--sky-deep);box-shadow:0 5px 0 #1B5379}
  .modeCard.three:active{box-shadow:0 2px 0 #1B5379}
  .modeCard.arizona{background:#3E8C56;box-shadow:0 5px 0 #235A34}
  .modeCard.arizona:active{box-shadow:0 2px 0 #235A34}
  .modeCard.shuttle{background:#6B4FA0;box-shadow:0 5px 0 #402F60}
  .modeCard.shuttle:active{box-shadow:0 2px 0 #402F60}
  .mc-icon{flex:none;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center}
  .mc-icon svg{width:22px;height:22px}
  .mc-body{flex:1;min-width:0}
  .mc-title{display:block;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:17px;line-height:1.15}
  .mc-sub{display:block;font-size:11px;opacity:.85;margin-top:2px;font-weight:700}
  .mc-top{display:flex;align-items:center;gap:4px;font-size:11px;opacity:.92;margin-top:5px;font-weight:900}
  .mc-chev{flex:none;font-size:22px;opacity:.8;font-weight:900}
  .util{flex:1;display:flex;align-items:center;gap:8px;border:0;background:#F0E4D6;color:#5A4636;
    border-radius:14px;padding:10px 12px;font-family:inherit;font-weight:900;font-size:12px}
  .util svg{flex:none;width:18px;height:18px;color:#8A6A4E}
  .util b{flex:1;text-align:left;font-weight:900}
  .toggleSw{flex:none;width:36px;height:21px;border-radius:11px;background:#CBB9A6;position:relative}
  .toggleSw.on{background:#3E8C56}
  .toggleSw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
    background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .toggleSw.on::after{left:17px}
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="chip"><small>SCORE</small><b id="score">0</b></div>
    <div class="chip" id="clock"><small>TIME</small><b id="time">60</b></div>
    <div class="chip" id="streak"><small id="runLabel">STREAK</small><b id="run">0</b></div>
    <button id="mute" aria-label="Mute">&#128266;</button>
    <button id="exit" aria-label="Exit to menu">&#10005;</button>
  </div>
  <div id="callout"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button id="pass">PASS</button>
    <div id="shootWrap">
      <svg id="meter" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,246,236,.14)" stroke-width="7"/>
        <circle id="band" cx="50" cy="50" r="46" fill="none" stroke="rgba(143,224,138,.85)"
                stroke-width="7" stroke-dasharray="0 289" transform="rotate(-90 50 50)"/>
        <circle id="fill" cx="50" cy="50" r="46" fill="none" stroke="#6EBAE7" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" transform="rotate(-90 50 50)"/>
      </svg>
      <button id="shoot">SHOOT</button>
    </div>
  </div>
</div>

function drawB(g,cx,cy,k,rot){
  g.save(); g.translate(cx,cy); g.rotate(rot); g.scale(k,k); g.translate(-BW/2,-BH/2);
  g.fillStyle="#FFFDF8"; g.fill(BPATH,"evenodd");
  g.lineWidth=(0.42*S)/k; g.strokeStyle="#4B2E15"; g.lineJoin="round";
  g.stroke(BPATH); g.restore();
}
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let S=6, floor=null, fw=0, fh=0;
const fx=x=>(x+PAD)*S, fy=y=>(y+PAD)*S;
const dpr=()=>Math.min(window.devicePixelRatio||1,2.5);

function layout(){
  const st=document.getElementById("stage"), w=st.clientWidth, h=st.clientHeight;
  S=Math.min(w/TW,h/TL);
  fw=Math.round(TW*S); fh=Math.round(TL*S);
  cv.width=fw*dpr(); cv.height=fh*dpr();
  cv.style.width=fw+"px"; cv.style.height=fh+"px";
  ctx.setTransform(dpr(),0,0,dpr(),0,0);
  floor=buildFloor();
}

/* ---------------- the floor ---------------- */
function arcPath(g,i){
  const h=hoops[i], base=i===0?0:CL, dir=i===0?1:-1;
  g.beginPath();
  g.moveTo(fx(CORNER_X),fy(base));
  g.lineTo(fx(CORNER_X),fy(h.y+dir*ARC_DY));
  if(dir>0) g.arc(fx(h.x),fy(h.y),ARC_R*S,Math.PI-ARC_A,ARC_A,true);
  else      g.arc(fx(h.x),fy(h.y),ARC_R*S,ARC_A-Math.PI,-ARC_A,false);
  g.lineTo(fx(CW-CORNER_X),fy(base));
}

function ribbon(g,pts,color){          // organic tapered swirl
  g.fillStyle=color; g.beginPath();
  const side=(sgn)=>{
    for(let k=0;k<pts.length;k++){
      const i2=Math.min(pts.length-1,k+1), i0=Math.max(0,k-1);
      const tx=pts[i2].x-pts[i0].x, ty=pts[i2].y-pts[i0].y, m=Math.hypot(tx,ty)||1;
      const nx=-ty/m*pts[k].w*sgn, ny=tx/m*pts[k].w*sgn;
      const X=fx(pts[k].x+nx), Y=fy(pts[k].y+ny);
      (k===0&&sgn>0)?g.moveTo(X,Y):g.lineTo(X,Y);
    }
  };
  side(1);
  for(let k=pts.length-1;k>=0;k--){
    const i2=Math.min(pts.length-1,k+1), i0=Math.max(0,k-1);
    const tx=pts[i2].x-pts[i0].x, ty=pts[i2].y-pts[i0].y, m=Math.hypot(tx,ty)||1;
    g.lineTo(fx(pts[k].x+ty/m*pts[k].w), fy(pts[k].y-tx/m*pts[k].w));
  }
  g.closePath(); g.fill();
}

function hash2(i,j){ const n=Math.sin(i*127.1+j*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){
  const i=Math.floor(x), j=Math.floor(y), u=x-i, v=y-j;
  const su=u*u*(3-2*u), sv=v*v*(3-2*v);
  const a=hash2(i,j), b=hash2(i+1,j), c=hash2(i,j+1), d=hash2(i+1,j+1);
  return a+(b-a)*su+(c-a)*sv+(a-b-c+d)*su*sv;
}
function flowRibbon(g,sx,sy,steps,w,color,seed){
  const pts=[]; let x=sx, y=sy;
  for(let k=0;k<steps;k++){                       // walk backwards first
    const a=vnoise(x/17+seed,y/17)*Math.PI*3.1;
    x-=Math.cos(a)*1.15; y-=Math.sin(a)*1.15;
  }
  for(let k=0;k<steps*2;k++){
    const a=vnoise(x/17+seed,y/17)*Math.PI*3.1;
    x+=Math.cos(a)*1.15; y+=Math.sin(a)*1.15;
    pts.push({x,y,w:w*(.86+.14*Math.sin(k*.11+seed))});
    if(x<-14||x>CW+14||y<-14||y>CL+14) break;
  }
  if(pts.length<4) return;
  g.fillStyle=color;
  ribbon(g,pts,color);
  [pts[0],pts[pts.length-1]].forEach(p=>{ g.beginPath(); g.arc(fx(p.x),fy(p.y),p.w*S,0,7); g.fill(); });
}

function mascot(g,x,y,r,rot){
  if(!mascotImg.complete||!mascotImg.naturalWidth) return;
  g.save(); g.translate(fx(x),fy(y)); g.rotate(rot);
  g.drawImage(mascotImg,-r*S,-r*S,r*2*S,r*2*S); g.restore();
}

function buildFloor(){
  const c=document.createElement("canvas");
  c.width=fw*dpr(); c.height=fh*dpr();
  const g=c.getContext("2d"); g.setTransform(dpr(),0,0,dpr(),0,0);

  /* apron */
  g.fillStyle="#F4571C"; g.fillRect(0,0,fw,fh);
  g.strokeStyle="#fff"; g.lineWidth=Math.max(2,S*.34);
  g.beginPath();
  g.moveTo(fx(6),S*1.0); g.lineTo(fx(CW-6),S*1.0);
  g.moveTo(fx(6),fh-S*1.0); g.lineTo(fx(CW-6),fh-S*1.0);
  g.stroke();
  g.save(); g.fillStyle="#fff";
  g.font=`${Math.max(7,S*1.35)}px Bungee, Impact, sans-serif`;
  g.textAlign="center"; g.textBaseline="middle";
  [[fx(-1.5),1],[fx(CW+1.5),-1]].forEach(([px,d])=>{
    g.save(); g.translate(px,fh/2); g.rotate(d*Math.PI/2);
    g.fillText("BUCKETSQUAD",0,0); g.restore();
  });
  g.restore();

  /* wood */
  g.save();
  g.beginPath(); g.rect(fx(0),fy(0),CW*S,CL*S); g.clip();
  g.fillStyle="#E9C289"; g.fillRect(fx(0),fy(0),CW*S,CL*S);
  g.strokeStyle="rgba(150,105,58,.18)"; g.lineWidth=1;
  for(let x=0;x<=CW;x+=0.6){ g.beginPath(); g.moveTo(fx(x),fy(0)); g.lineTo(fx(x),fy(CL)); g.stroke(); }
  g.strokeStyle="rgba(150,105,58,.3)";
  for(let x=0;x<CW;x+=0.6){
    for(let y=(x*3)%9;y<CL;y+=9){ g.beginPath(); g.moveTo(fx(x),fy(y)); g.lineTo(fx(x+0.6),fy(y)); g.stroke(); }
  }
  const dark="#96632F", mid="#C8945B";
  let n=0;
  [[3.7,dark],[11.3,mid],[21.9,dark],[5.2,mid]].forEach(([seed,col],L)=>{
    for(let i=0;i<11;i++,n++){
      const r1=hash2(n*3.3,seed), r2=hash2(n*5.1,seed+2), r3=hash2(n*1.9,seed+5);
      const gx=-5+((i%3)+r1)*(CW+10)/3, gy=-4+((i/3|0)+r2)*(CL+8)/4;
      flowRibbon(g, gx, gy, 30+Math.floor(r3*30), 1.5+r1*1.2, col, seed);
    }
  });
  g.restore();

  /* blue paint inside each arc */
  hoops.forEach((h,i)=>{
    const base=i===0?0:CL, dir=i===0?1:-1;
    g.save();
    arcPath(g,i); g.closePath();
    g.fillStyle="#5BB0E6"; g.fill(); g.clip();
    g.fillStyle="#93CDEF";
    for(let k=0;k<5;k++){
      const pts=[];
      for(let x=-4;x<=CW+4;x+=1.4){
        pts.push({x, y:base+dir*(2.5+k*5.2+Math.sin((x/10)+k*1.4)*2.8), w:1.5+Math.sin(x/7+k)*.6});
      }
      ribbon(g,pts,"#93CDEF");
    }
    g.restore();
  });

  /* keys */
  hoops.forEach((h,i)=>{
    const base=i===0?0:CL, dir=i===0?1:-1;
    g.fillStyle="#F4571C";
    g.fillRect(fx(h.x-KEY_W/2),fy(Math.min(base,base+dir*KEY_L)),KEY_W*S,KEY_L*S);
  });

  /* white lines */
  g.strokeStyle="#fff"; g.lineWidth=Math.max(1.7,S*.3); g.lineCap="butt";
  g.strokeRect(fx(0),fy(0),CW*S,CL*S);
  g.beginPath(); g.moveTo(fx(0),fy(CL/2)); g.lineTo(fx(CW),fy(CL/2)); g.stroke();
  g.beginPath(); g.arc(fx(CW/2),fy(CL/2),6*S,0,7); g.stroke();
  hoops.forEach((h,i)=>{
    const base=i===0?0:CL, dir=i===0?1:-1;
    g.strokeRect(fx(h.x-KEY_W/2),fy(Math.min(base,base+dir*KEY_L)),KEY_W*S,KEY_L*S);
    g.beginPath(); g.arc(fx(h.x),fy(base+dir*KEY_L),6*S,0,7); g.stroke();
    arcPath(g,i); g.stroke();
    g.fillStyle="#20160F";
    [7,11,14.5].forEach(d=>{
      g.fillRect(fx(h.x-KEY_W/2)-S*.9,fy(base+dir*d),S*.9,S*.35);
      g.fillRect(fx(h.x+KEY_W/2),fy(base+dir*d),S*.9,S*.35);
    });
  });

  /* marks sit on top of the lines */
  hoops.forEach((h,i)=>{
    const base=i===0?0:CL, dir=i===0?1:-1;
    drawB(g,fx(h.x),fy(base+dir*KEY_L*.5),10.5*S/BH,dir>0?Math.PI:0);
  });
  drawB(g,fx(CW/2),fy(CL/2),29*S/BH,Math.PI/2);
  mascot(g,37.5,29,2.7,-.15);
  mascot(g,13,65,2.7,.2);
  return c;
}

async function loadBoards(){
  // each mode's board is fetched independently -- one collection failing
  // (missing rules, offline, etc.) must never blank out the other boards
  const fetchOne=async(m)=>{
    try{
      const snap=await db.collection("scores_"+m).orderBy("score",MODES[m].asc?"asc":"desc").limit(10).get();
      return snap.docs.map(d=>({n:d.data().name,s:d.data().score}));
    }catch(e){ return null; }
  };
  const [g,t,a,sh]=await Promise.all(["game","three","arizona","shuttle"].map(fetchOne));
  if(g) boards.game=g;
  if(t) boards.three=t;
  if(a) boards.arizona=a;
  if(sh) boards.shuttle=sh;
  try{ playerName=window.localStorage.getItem("bucketsquad:name")||""; }catch(e){}
}
async function saveScore(m,name,sc){
  const nm=(name||"Player").slice(0,12);
  let ok=true;
  try{
    await db.collection("scores_"+m).add({name:nm,score:sc,ts:firebase.firestore.FieldValue.serverTimestamp()});
  }catch(e){ ok=false; }
  await loadBoards();
  return {ok, rank: boards[m].findIndex(r=>r.n===nm&&r.s===sc)};
}

/* ---------------- game state ---------------- */
const team=[
  {x:CW/2-6,y:30,vx:0,vy:0,bob:0,num:"3",jersey:"#F4571C"},
  {x:CW/2+7,y:24,vx:0,vy:0,bob:0,num:"7",jersey:"#2F7FBF"}
];
let handler=0;
const D={x:CW/2,y:19,on:true,slow:0};
let ball=null, power=0, charging=false, dirCharge=1, stealCool=0;
let score=0, run=0, timeLeft=60, playing=false, last=0, shake=0, ripples=[];

/* 3-point contest: five racks, last ball of each is a money ball,
   and the top-of-the-key rack is all money. */
const RACK_SPOTS=[{x:2.6,y:14},{x:10.5,y:22.5},{x:CW/2,y:27.8},{x:39.5,y:22.5},{x:CW-2.6,y:14}];
let racks=[], holding=false, moneyHeld=0, activeRack=0;
function buildRacks(){
  racks=RACK_SPOTS.map((r,i)=>({x:r.x,y:r.y,balls:i===2?[1,1,1,1,1]:[0,0,0,0,1]}));
}
const ballsLeft=()=>racks.reduce((n,r)=>n+r.balls.length,0);
function nearestRack(){
  let best=-1,bd=1e9;
  racks.forEach((r,i)=>{ if(!r.balls.length) return;
    const d=Math.hypot(r.x-team[0].x,r.y-team[0].y); if(d<bd){bd=d;best=i;} });
  return best;
}

/* Arizona Drill: the runner (team[0]) always carries the ball; two fixed relay
   spots per leg bounce it along automatically, the second one leads the pass
   all the way to the rim. azStep: 0 running to relay A, 1 ball out to A,
   2 ball back from A, 3 running to relay B, 4 ball out to B, 5 ball ahead
   from B to the rim, 6 at the rim, ready to shoot. */
/* Each leg hugs a single sideline the whole way -- no mid-leg crossover -- and
   leg 1 is leg 0 mirrored 180 degrees, so the two lines never share a lane. */
const AZ_LEGS=[
  {hoop:0, start:{x:30,y:80}, relays:[{x:CW-4,y:CL*0.62},{x:CW-4,y:CL*0.30}], finish:{x:30,y:14}},
  {hoop:1, start:{x:20,y:14}, relays:[{x:4,y:CL*0.38},{x:4,y:CL*0.70}], finish:{x:20,y:80}}
];
let azLeg=0, azStep=0, azAttempts=0;
function azAdvanceLeg(){
  azLeg=1-azLeg; azStep=0;
  const s=AZ_LEGS[azLeg].start;
  team[0].x=s.x; team[0].y=s.y; team[0].vx=team[0].vy=0;
}

/* the mirror (team[1]) always runs the leg opposite the player's current one,
   walks its own waypoint chain, and never misses -- pure atmosphere, its makes
   just add straight to the shared score */
let mWp=0, mLeg=1;   // the mirror's own leg tracker -- fully independent of
                      // the player's azLeg, so it never resets when the
                      // player scores and can lap them if it's faster
function stepMirror(dt){
  const leg=AZ_LEGS[mLeg];
  const path=[leg.start,leg.relays[0],leg.relays[1],leg.finish,hoops[leg.hoop]];
  const m=team[1], wp=path[mWp];
  const dx=wp.x-m.x, dy=wp.y-m.y, d=Math.hypot(dx,dy)||1;
  if(d<1.6){
    if(mWp===path.length-1){
      score++; sfx.swish(); ripples.push({x:wp.x,y:wp.y,t:0}); hud();
      mLeg=1-mLeg; mWp=0;
      const ns=AZ_LEGS[mLeg].start;
      m.x=ns.x; m.y=ns.y;
    }else mWp++;
  }else{
    m.x+=dx/d*17*dt; m.y+=dy/d*17*dt;
  }
  m.bob+=dt*7;
}

/* Shuttle Run: a straight conditioning sprint, no ball at all. The court is
   split into 11 evenly spaced lanes (player in the middle); everyone runs the
   same up-and-back pattern -- near free-throw line, back, half court, back,
   far free-throw line, back, then one final full-length sprint to finish.
   Checkpoints are just Y lines (touch anywhere across the width), not points,
   so shStep only needs to compare y. The 10 AI racers loop the pattern (with
   randomized pace) for the whole session and never affect the player's run. */
const SHUTTLE_LANES=Array.from({length:11},(_,i)=>3+i*4.4);
const SHUTTLE_STOPS=[75,94,47,94,19,94,0];
const SHUTTLE_LOOP=[...SHUTTLE_STOPS,94];
let shStep=0, shRacers=[];
function shuttleReset(){
  shStep=0;
  const jerseys=["#2F7FBF","#4B6A50","#7A6A50","#B08A67","#8FE08A","#C97B4A"];
  shRacers=SHUTTLE_LANES.filter((_,i)=>i!==5).map((x,idx)=>({
    x, y:94, step:0, pace:0.82+Math.random()*0.36, bob:0, jersey:jerseys[idx%jerseys.length]
  }));
}
function stepShuttleRacers(dt){
  shRacers.forEach(r=>{
    const target=SHUTTLE_LOOP[r.step];
    const dy=target-r.y;
    if(Math.abs(dy)<1.2) r.step=(r.step+1)%SHUTTLE_LOOP.length;
    else r.y+=Math.sign(dy)*17*r.pace*dt;
    r.bob+=dt*7;
  });
}

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mate=()=>team[1-handler];
const me=()=>team[handler];
function target(){ return mode==="arizona"?hoops[AZ_LEGS[azLeg].hoop]:hoops[0]; }
function isThree(p,h){
  if(Math.abs(p.y-h.y)<=ARC_DY) return p.x<CORNER_X||p.x>CW-CORNER_X;
  return dist(p,h)>ARC_R;
}
const idealPower=d=>Math.max(.1,Math.min(.95,d/30));

/* ---------------- sound ---------------- */
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null, master=null, muted=false, dribT=.3;
function audio(){
  if(!AC) return null;
  if(!ac){ ac=new AC(); master=ac.createGain(); master.gain.value=.5; master.connect(ac.destination); }
  if(ac.state==="suspended") ac.resume();
  return ac;
}
function tone(f1,f2,dur,type,vol,delay){
  const c=audio(); if(!c||muted) return;
  const t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f1,t);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+Math.min(.015,dur*.3));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function noise(dur,f1,f2,vol,q,delay){
  const c=audio(); if(!c||muted) return;
  const t=c.currentTime+(delay||0), n=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=q||1.2;
  bp.frequency.setValueAtTime(f1,t);
  if(f2) bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+dur+.03);
}
const sfx={
  dribble(){ tone(125,58,.10,"sine",.09); noise(.03,900,400,.025,1); },
  shoot(){ noise(.17,600,2400,.045,.8); },
  swish(){ noise(.30,3400,900,.10,1.5); tone(659,659,.13,"triangle",.075); tone(988,988,.18,"triangle",.065,.10); },
  money(){ [784,1047,1319,1568].forEach((f,i)=>tone(f,f,.20,"triangle",.075,i*.07)); },
  rim(){ tone(430,300,.17,"square",.06); tone(660,520,.10,"square",.04,.03); noise(.13,1500,600,.045,2.4); },
  pass(){ noise(.09,1300,500,.055,1); tone(210,120,.08,"sine",.055); },
  steal(){ tone(520,110,.30,"sawtooth",.075); },
  streak(){ [659,880,1175].forEach((f,i)=>tone(f,f,.16,"triangle",.06,i*.09)); },
  pickup(){ tone(320,480,.09,"triangle",.05); },
  nope(){ tone(200,150,.14,"square",.05); },
  tip(){ tone(880,880,.10,"square",.08); tone(1318,1318,.15,"square",.08,.12); },
  horn(){ tone(165,120,.75,"square",.10); tone(110,88,.75,"square",.07); }
};
/* ---------------- input ---------------- */
let move={x:0,y:0};
const stick=el("stick"), knob=el("knob"); let stickId=null;
function stickAt(e){
  const r=stick.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy), cap=r.width/2-11;
  if(m>cap){dx=dx/m*cap; dy=dy/m*cap;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  move.x=dx/cap; move.y=dy/cap;
}
stick.addEventListener("pointerdown",e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickAt(e);});
stick.addEventListener("pointermove",e=>{if(e.pointerId===stickId)stickAt(e);});
["pointerup","pointercancel"].forEach(t=>stick.addEventListener(t,e=>{
  if(e.pointerId!==stickId)return; stickId=null; move.x=move.y=0; knob.style.transform="translate(0,0)";
}));

const fill=el("fill"), band=el("band");
const canShoot=()=>playing&&!ball&&(mode==="game"||holding||(mode==="arizona"&&azStep===6));
function beginShot(){ audio(); if(!canShoot()) return; charging=true; power=0; dirCharge=1; }
function endShot(){ if(!charging) return; charging=false; release(); }
el("shoot").addEventListener("pointerdown",e=>{e.preventDefault();beginShot();});
["pointerup","pointerleave","pointercancel"].forEach(t=>el("shoot").addEventListener(t,endShot));
el("pass").addEventListener("pointerdown",e=>{e.preventDefault();doPass();});
addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.code==="Space"){e.preventDefault();beginShot();}
  if(e.code==="KeyP"||e.code==="ShiftLeft"){e.preventDefault();doPass();}
  const k={KeyW:[0,-1],ArrowUp:[0,-1],KeyS:[0,1],ArrowDown:[0,1],KeyA:[-1,0],ArrowLeft:[-1,0],KeyD:[1,0],ArrowRight:[1,0]}[e.code];
  if(k){move.x=k[0]||move.x; move.y=k[1]||move.y;}
});
addEventListener("keyup",e=>{
  if(e.code==="Space") endShot();
  if(["KeyW","KeyS","ArrowUp","ArrowDown"].includes(e.code)) move.y=0;
  if(["KeyA","KeyD","ArrowLeft","ArrowRight"].includes(e.code)) move.x=0;
});

/* ---------------- actions ---------------- */
function doPass(){
  if(!playing||ball||charging) return;
  if(mode==="game"){
    const from=me(), to=mate(), d=dist(from,to);
    sfx.pass();
    ball={mode:"pass",sx:from.x,sy:from.y,ex:to.x,ey:to.y,t:0,dur:Math.max(.22,d*.021),peak:2.4};
    D.slow=.55;
  }else if(mode==="arizona"&&(azStep===0||azStep===3)){
    // fires from wherever the runner currently is -- no need to be right on
    // top of the relay spot, same as a real outlet pass thrown on the move
    const leg=AZ_LEGS[azLeg], p=team[0], r=azStep===0?leg.relays[0]:leg.relays[1];
    const d=dist(p,r);
    ball={mode:"pass",sx:p.x,sy:p.y,ex:r.x,ey:r.y,t:0,dur:Math.max(.2,d/22),peak:2+Math.min(6,d*.08)};
    azStep=azStep===0?1:4; sfx.pass();
  }
}
function release(){
  const p=me(), h=target(), d=dist(p,h), three=isThree(p,h);
  if(mode==="three"&&!three){ sfx.nope(); say("BEHIND THE LINE!","#FFD08A"); return; }
  const err=Math.abs(power-idealPower(d));
  const guard=(mode==="game"&&D.on)?dist(p,D):99;
  const contest=guard<5?.30*(1-guard/5)+.10:0;
  const rush=Math.hypot(p.vx,p.vy)>6?.12:0;
  let odds=1-err*3.0-contest-rush-Math.max(0,(d-8)*.011);
  if(d<4) odds+=.35;
  if(guard>9) odds+=.10;                       // reward finding the open man
  const made=Math.random()<Math.max(.05,Math.min(.97,odds));
  ball={mode:"shot",sx:p.x,sy:p.y-1,t:0,dur:.45+d*.028,peak:9+d*.16,made,three,h,money:moneyHeld,
        ex:made?h.x:h.x+(Math.random()*2-1)*(1.4+err*7),
        ey:made?h.y:h.y+(Math.random()*2-1)*(1.4+err*7)};
  if(mode==="three") holding=false;
  fill.setAttribute("stroke-dashoffset",289);
  sfx.shoot();
}
function say(t,c){
  const n=el("callout"); n.textContent=t; n.style.color=c||"#fff";
  n.classList.remove("go"); void n.offsetWidth; n.classList.add("go");
}
function hud(){
  el("score").textContent=score;
  el("run").textContent=(mode==="three")?ballsLeft()+(holding?1:0):(mode==="arizona"?azAttempts:run);
}
function resolveShot(){
  if(ball.made){
    let pts;
    if(mode==="three"){ pts=ball.money?2:1; if(ball.money) sfx.money(); else sfx.swish(); }
    else if(mode==="arizona"){ pts=1; sfx.swish(); }
    else { pts=ball.three?3:2; sfx.swish(); }
    score+=pts; run++;
    ripples.push({x:ball.h.x,y:ball.h.y,t:0});
    if(mode==="three") say(ball.money?"MONEY! +2":"+1",ball.money?"#FFC93F":"#fff");
    else if(mode==="arizona") say("LAYUP!");
    else say(run>=3?`${pts} PTS · HEATING UP`:(ball.three?"THREE!":"BUCKET!"));
    if(run>=3&&mode!=="arizona"&&!(mode==="three"&&ball.money)) sfx.streak();
    shake=ball.money?.45:.35;
  }else{
    run=0; sfx.rim();
    say(mode==="arizona"?"MISSED":(Math.random()<.5?"OFF THE RIM":"NO GOOD"));
  }
  if(mode==="arizona"){ azAttempts++; azAdvanceLeg(); }
  hud(); ball=null;
}

/* ---------------- simulation ---------------- */
function step(dt){
  if(stealCool>0){ stealCool-=dt; if(stealCool<=0) ball=null; }

  if(charging){
    power+=dirCharge*dt*1.15;
    if(power>1){power=1;dirCharge=-1;}
    if(power<0){power=0;dirCharge=1;}
    fill.setAttribute("stroke-dashoffset",289-289*power);
  }
  updateBand();

  const p=me(), sp=charging?5:17;
  const m=Math.hypot(move.x,move.y);
  const live=m>.12, nx=live?move.x/Math.max(1,m):0, ny=live?move.y/Math.max(1,m):0;
  p.vx+=(nx*sp-p.vx)*Math.min(1,dt*12);
  p.vy+=(ny*sp-p.vy)*Math.min(1,dt*12);
  p.x=Math.max(1.4,Math.min(CW-1.4,p.x+p.vx*dt));
  p.y=Math.max(1.4,Math.min(CL-1.4,p.y+p.vy*dt));
  p.bob+=dt*(4+Math.hypot(p.vx,p.vy)*.8);

  if(mode==="three"){
    activeRack=nearestRack();
    if(!holding&&!ball&&activeRack>=0){
      const r=racks[activeRack];
      if(Math.hypot(r.x-p.x,r.y-p.y)<3.4){
        moneyHeld=r.balls.shift(); holding=true; sfx.pickup(); hud();
      }
    }
    if(!holding&&!ball&&ballsLeft()===0){ playing=false; gameOver(); return; }
    if(!ball&&holding){
      dribT-=dt;
      if(dribT<=0){ sfx.dribble(); dribT=.44-Math.min(.16,Math.hypot(p.vx,p.vy)*.014); }
    }
    ripples.forEach(r=>r.t+=dt);
    ripples=ripples.filter(r=>r.t<.7);
    if(ball){ ball.t+=dt; if(ball.t>=ball.dur) resolveShot(); }
    if(shake>0) shake=Math.max(0,shake-dt);
    return;
  }

  if(mode==="arizona"){
    stepMirror(dt);
    const leg=AZ_LEGS[azLeg], rA=leg.relays[0], rB=leg.relays[1];
    // relay A and relay B passes are player-initiated (PASS button, in doPass());
    // step() only advances a pass already in flight, plus the auto-led return/ahead throws
    if(ball&&ball.mode==="pass"&&(azStep===1||azStep===2||azStep===4||azStep===5)){
      if(azStep===2){ ball.ex=p.x; ball.ey=p.y; }
      ball.t+=dt;
      if(ball.t>=ball.dur){
        if(azStep===1){
          const d=dist(rA,p);
          ball={mode:"pass",sx:rA.x,sy:rA.y,ex:p.x,ey:p.y,t:0,dur:Math.max(.16,d*.021),peak:2.2};
          azStep=2; sfx.pass();
        }else if(azStep===2){ ball=null; azStep=3; }
        else if(azStep===4){
          // fixed target, not the runner's live spot: this pass leads all the way
          // to leg.finish (a realistic catch spot near the key, not the rim itself),
          // so the runner has to sprint the court to meet it, then finish with a real shot
          const fp=leg.finish, d=dist(rB,fp);
          ball={mode:"pass",sx:rB.x,sy:rB.y,ex:fp.x,ey:fp.y,t:0,dur:Math.max(.9,d/15),peak:9};
          azStep=5; sfx.pass();
        }else if(azStep===5){ ball=null; azStep=6; }
      }
    }else if(ball&&ball.mode==="shot"){
      ball.t+=dt;
      if(ball.t>=ball.dur) resolveShot();
    }
    if(!ball&&(azStep===0||azStep===3)){
      dribT-=dt;
      if(dribT<=0){ sfx.dribble(); dribT=.44-Math.min(.16,Math.hypot(p.vx,p.vy)*.014); }
    }
    ripples.forEach(r=>r.t+=dt);
    ripples=ripples.filter(r=>r.t<.7);
    if(shake>0) shake=Math.max(0,shake-dt);
    return;
  }

  if(mode==="shuttle"){
    stepShuttleRacers(dt);
    if(shStep<SHUTTLE_STOPS.length&&Math.abs(p.y-SHUTTLE_STOPS[shStep])<1.5){
      shStep++; sfx.pickup();
      if(shStep>=SHUTTLE_STOPS.length){
        score=Math.round((MODES.shuttle.secs-timeLeft)*10);   // deciseconds, an int for Firestore
        playing=false; gameOver(); return;
      }
    }
    if(shake>0) shake=Math.max(0,shake-dt);
    return;
  }

  /* two on one */
  const t2=mate(), h=target();
  const ang=Math.atan2(p.y-h.y,p.x-h.x);
  const far=dist(p,h)>25;
  const wantR=far?9:20.5, wantA=ang+(t2.x<p.x?-1:1)*1.5;
  let tx=h.x+Math.cos(wantA)*wantR, ty=h.y+Math.sin(wantA)*wantR;
  tx=Math.max(3,Math.min(CW-3,tx)); ty=Math.max(3,Math.min(CL-3,ty));
  const dx=tx-t2.x, dy=ty-t2.y, dd=Math.hypot(dx,dy);
  const ts=Math.min(11,dd*3);
  if(dd>.4){ t2.x+=dx/dd*ts*dt; t2.y+=dy/dd*ts*dt; }
  t2.bob+=dt*3.4;

  if(D.on){
    D.slow=Math.max(0,D.slow-dt);
    const goal=ball&&ball.mode==="shot"?{x:h.x,y:h.y}:{x:p.x*.82+h.x*.18,y:p.y*.82+h.y*.18};
    const gx=goal.x-D.x, gy=goal.y-D.y, gd=Math.hypot(gx,gy)||1;
    const spd=(D.slow>0?6.5:11.4);
    D.x+=gx/gd*spd*dt; D.y+=gy/gd*spd*dt;
    if(gd<2){ D.x-=gx/gd*spd*dt*1.1; D.y-=gy/gd*spd*dt*1.1; }
  }

  if(ball&&stealCool<=0){
    ball.t+=dt;
    const t=ball.t/ball.dur;
    if(ball.mode==="pass"){
      ball.ex=t2.x; ball.ey=t2.y;
      const bx=ball.sx+(ball.ex-ball.sx)*t, by=ball.sy+(ball.ey-ball.sy)*t;
      if(D.on&&Math.hypot(D.x-bx,D.y-by)<1.9){
        run=0; hud(); stealCool=.9; sfx.steal(); say("PICKED OFF","#FFD08A");
        ball.mode="steal";
      }else if(ball.t>=ball.dur){
        handler=1-handler; ball=null; me().vx=me().vy=0;
      }
    }else if(ball.mode==="shot"&&ball.t>=ball.dur){ resolveShot(); }
  }

  if(!ball){
    dribT-=dt;
    if(dribT<=0){ sfx.dribble(); dribT=.44-Math.min(.16,Math.hypot(p.vx,p.vy)*.014); }
  }else dribT=Math.min(dribT,.18);

  ripples.forEach(r=>r.t+=dt);
  ripples=ripples.filter(r=>r.t<.7);
  if(shake>0) shake=Math.max(0,shake-dt);
}

/* the green window on the meter is the power this shot actually wants */
function updateBand(){
  if(!band) return;
  if(!charging){ band.setAttribute("stroke-dasharray","0 289"); return; }
  const d=dist(me(),target()), i=idealPower(d), tol=.085;
  const a=Math.max(0,i-tol), b=Math.min(1,i+tol);
  band.setAttribute("stroke-dasharray",`${((b-a)*289).toFixed(1)} 289`);
  band.setAttribute("stroke-dashoffset",`${(-a*289).toFixed(1)}`);
}

/* ---------------- rendering ---------------- */
function drawKid(pl,hasBall,open){
  const px=fx(pl.x), py=fy(pl.y), r=S*1.2;
  ctx.save();
  ctx.fillStyle="rgba(40,26,14,.28)";
  ctx.beginPath(); ctx.ellipse(px,py+r*.78,r*1.05,r*.42,0,0,7); ctx.fill();
  if(hasBall){
    ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=S*.22;
    ctx.beginPath(); ctx.arc(px,py+r*.2,r*1.25,0,7); ctx.stroke();
  }
  ctx.fillStyle=pl.jersey;
  ctx.beginPath(); ctx.ellipse(px,py,r*.86,r*.72,0,0,7); ctx.fill();
  ctx.strokeStyle="#E7B183"; ctx.lineWidth=r*.32; ctx.lineCap="round";
  const sw=Math.sin(pl.bob*2)*r*.22;
  ctx.beginPath();
  ctx.moveTo(px-r*.7,py); ctx.lineTo(px-r*1.12,py+sw);
  ctx.moveTo(px+r*.7,py); ctx.lineTo(px+r*1.12,py-sw); ctx.stroke();
  ctx.fillStyle="#E7B183";
  ctx.beginPath(); ctx.arc(px,py-r*.36,r*.6,0,7); ctx.fill();
  ctx.fillStyle="rgba(30,18,8,.85)";
  ctx.beginPath(); ctx.arc(px,py-r*.55,r*.58,Math.PI*1.06,Math.PI*1.94); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font=`${r*.66}px Bungee, Impact, sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(pl.num,px,py+r*.2);
  if(open){
    ctx.fillStyle="#8FE08A"; ctx.font=`${S*1.35}px Bungee, Impact, sans-serif`;
    ctx.fillText("OPEN",px,py-r*1.9);
  }
  ctx.restore();
}
function drawBall(x,y,r,gold){
  ctx.save();
  ctx.fillStyle=gold?"#FFC93F":"#F0571F"; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.strokeStyle=gold?"rgba(90,60,0,.8)":"rgba(60,30,10,.75)"; ctx.lineWidth=Math.max(1,r*.14);
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y);
  ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.restore();
}
function drawRacks(){
  racks.forEach((r,i)=>{
    if(!r.balls.length) return;
    const px=fx(r.x), py=fy(r.y);
    if(i===activeRack&&!holding){
      const pu=(Date.now()%800)/800;
      ctx.strokeStyle=`rgba(143,224,138,${.7-pu*.6})`; ctx.lineWidth=S*.4;
      ctx.beginPath(); ctx.arc(px,py,S*(2+pu*2.6),0,7); ctx.stroke();
    }
    ctx.fillStyle="rgba(30,20,12,.30)";
    ctx.beginPath(); ctx.ellipse(px,py+S*.5,S*2.3,S*.85,0,0,7); ctx.fill();
    r.balls.forEach((mny,j)=>{
      const off=(j-(r.balls.length-1)/2)*1.05;
      drawBall(px+off*S,py,S*.5,mny);
    });
  });
}
function drawAZRelays(){
  // both legs are always "live" -- the player runs one, the mirror runs the
  // other -- so both sets of relay/queue groups need to be on screen always
  AZ_LEGS.forEach((leg,li)=>leg.relays.forEach((r,i)=>{
    const active=li===azLeg&&(i===0?azStep<=2:azStep>=3&&azStep<=5);
    const qDir=r.x<CW/2?-1:1;   // queue trails toward the nearer sideline, off the court
    [1,2].forEach(k=>{
      drawKid({x:r.x+qDir*k*1.4,y:r.y+(k%2?-0.9:0.9),bob:0,num:"",jersey:"#5C4E3F"},false,false);
    });
    if(active){
      const pu=(Date.now()%800)/800;
      ctx.strokeStyle=`rgba(143,224,138,${.7-pu*.6})`; ctx.lineWidth=S*.4;
      ctx.beginPath(); ctx.arc(fx(r.x),fy(r.y),S*(2+pu*2.6),0,7); ctx.stroke();
    }
    drawKid({x:r.x,y:r.y,bob:0,num:i===0?"A":"B",jersey:i===0?"#7A6A50":"#4B6A50"},false,false);
  }));
}
function drawShuttleField(){
  shRacers.forEach(r=>drawKid({x:r.x,y:r.y,bob:r.bob,num:"",jersey:r.jersey},false,false));
  if(shStep<SHUTTLE_STOPS.length){
    const ty=SHUTTLE_STOPS[shStep], pu=(Date.now()%700)/700;
    ctx.strokeStyle=`rgba(143,224,138,${.75-pu*.55})`; ctx.lineWidth=S*(0.5+pu*0.3);
    ctx.beginPath(); ctx.moveTo(fx(0),fy(ty)); ctx.lineTo(fx(CW),fy(ty)); ctx.stroke();
  }
}
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake*10,(Math.random()-.5)*shake*10);
  ctx.clearRect(-30,-30,fw+60,fh+60);
  ctx.drawImage(floor,0,0,fw,fh);

  const tgt=target();
  hoops.forEach(h=>{
    const bx=fx(h.x), by=fy(h.y+(h.y<CL/2?-3.2:3.2));
    ctx.fillStyle="rgba(255,255,255,.92)"; ctx.fillRect(bx-S*3,by-S*.35,S*6,S*.7);
    if(h===tgt&&!ball){
      const pu=(Date.now()%900)/900;
      ctx.strokeStyle=`rgba(110,186,231,${.6-pu*.5})`; ctx.lineWidth=S*.4;
      ctx.beginPath(); ctx.arc(fx(h.x),fy(h.y),S*(1.6+pu*2.4),0,7); ctx.stroke();
    }
    ctx.strokeStyle="#F0571F"; ctx.lineWidth=S*.42;
    ctx.beginPath(); ctx.arc(fx(h.x),fy(h.y),S*1.12,0,7); ctx.stroke();
    ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=S*.12;
    for(let a=0;a<8;a++){
      const an=a/8*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(fx(h.x)+Math.cos(an)*S*1.12,fy(h.y)+Math.sin(an)*S*1.12);
      ctx.lineTo(fx(h.x)+Math.cos(an)*S*.38,fy(h.y)+Math.sin(an)*S*.38); ctx.stroke();
    }
  });

  if(mode==="three") drawRacks();
  else if(mode==="arizona") drawAZRelays();
  else if(mode==="shuttle") drawShuttleField();

  ripples.forEach(r=>{
    ctx.strokeStyle=`rgba(240,87,31,${.8-r.t/.7})`; ctx.lineWidth=S*.5;
    ctx.beginPath(); ctx.arc(fx(r.x),fy(r.y),S*(1.5+r.t*22),0,7); ctx.stroke();
  });

  if(mode==="game"&&D.on){
    const px=fx(D.x), py=fy(D.y), r=S*1.2;
    ctx.save();
    ctx.fillStyle="rgba(40,26,14,.28)";
    ctx.beginPath(); ctx.ellipse(px,py+r*.78,r*1.05,r*.42,0,0,7); ctx.fill();
    ctx.fillStyle="#3A4B6B";
    ctx.beginPath(); ctx.ellipse(px,py,r*.86,r*.72,0,0,7); ctx.fill();
    ctx.strokeStyle="#C89264"; ctx.lineWidth=r*.3; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(px-r*.7,py-r*.2); ctx.lineTo(px-r*1.2,py-r*.7);
    ctx.moveTo(px+r*.7,py-r*.2); ctx.lineTo(px+r*1.2,py-r*.7); ctx.stroke();
    ctx.fillStyle="#C89264"; ctx.beginPath(); ctx.arc(px,py-r*.36,r*.58,0,7); ctx.fill();
    ctx.fillStyle="rgba(20,14,8,.9)";
    ctx.beginPath(); ctx.arc(px,py-r*.5,r*.56,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    ctx.restore();
  }

  if(mode==="game"){
    const openMate=D.on?dist(mate(),D)>8.5:true;
    drawKid(mate(),false,!ball&&openMate);
    drawKid(me(),!ball,false);
  }else{
    drawKid(team[0],(mode==="arizona"?true:holding)&&!ball,false);
    if(mode==="arizona"){
      drawKid(team[1],true,false);
      const mdr=Math.abs(Math.sin(team[1].bob*3));
      drawBall(fx(team[1].x)+S*1.5,fy(team[1].y)+S*(.6+mdr*.5),S*.55,false);
    }
  }

  if(charging&&!ball){
    const p=me(), h=target();
    ctx.setLineDash([S*1.2,S*1]); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=S*.18;
    ctx.beginPath(); ctx.moveTo(fx(p.x),fy(p.y)); ctx.lineTo(fx(h.x),fy(h.y)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=(mode==="three"&&moneyHeld)?"#FFC93F":"#fff";
    ctx.font=`${S*1.6}px Bungee, Impact, sans-serif`; ctx.textAlign="center";
    ctx.fillText(mode==="three"?(moneyHeld?"MONEY":"1PT"):mode==="arizona"?"LAYUP":(isThree(p,h)?"3PT":"2PT"),fx(p.x),fy(p.y)-S*2.8);
  }

  if(ball&&ball.mode!=="steal"){
    const t=Math.min(1,ball.t/ball.dur);
    const bx=ball.sx+(ball.ex-ball.sx)*t, by=ball.sy+(ball.ey-ball.sy)*t;
    const hgt=Math.sin(t*Math.PI)*ball.peak;
    ctx.fillStyle="rgba(40,26,14,.22)";
    ctx.beginPath(); ctx.ellipse(fx(bx),fy(by),S*.5,S*.28,0,0,7); ctx.fill();
    drawBall(fx(bx),fy(by)-hgt*S*.55,S*(.62+hgt*.02),ball.mode==="shot"&&ball.money);
  }else if(!ball&&(mode==="game"||holding||mode==="arizona")){
    const p=me(), dr=Math.abs(Math.sin(p.bob*3));
    drawBall(fx(p.x)+S*1.5,fy(p.y)+S*(.6+dr*.5),S*.55,mode==="three"&&moneyHeld);
  }else if(ball&&mode==="game"){
    drawBall(fx(D.x),fy(D.y)+S*1.2,S*.55);
  }
  ctx.restore();
}

/* ---------------- shell ---------------- */
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0); last=ts;
  if(playing){
    step(dt);
    if(playing){
      timeLeft-=dt;
      if(mode==="shuttle"){
        el("time").textContent=(MODES.shuttle.secs-timeLeft).toFixed(1);
        el("run").textContent=`${Math.min(shStep+1,SHUTTLE_STOPS.length)}/${SHUTTLE_STOPS.length}`;
      }else{
        el("time").textContent=Math.max(0,Math.ceil(timeLeft));
      }
      if(timeLeft<=0){ playing=false; gameOver(); }
    }
  }
  draw();
  requestAnimationFrame(frame);
}

function card(html){ el("overlay").classList.remove("hide"); el("card").innerHTML=html; }
function nameFromInput(){
  const i=el("nm");
  if(i&&i.value.trim()){
    playerName=i.value.trim().slice(0,12);
    try{ window.localStorage.setItem("bucketsquad:name",playerName); }catch(e){}
  }
  return playerName;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* small hand-drawn line icons for the home screen -- no icon font/library,
   just inline SVG, matching the rest of the game's no-external-asset style */
const ICONS={
  stopwatch:'<circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 2h6"/><path d="M12 2v2"/>',
  ball:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3v18"/><path d="M5.5 5.5c3 3 3 10 0 13"/><path d="M18.5 5.5c-3 3-3 10 0 13"/>',
  cone:'<path d="M12 3l5 15H7z"/><path d="M9 12h6"/><path d="M4 21h16"/><path d="M6 21l1.5-3h9L18 21"/>',
  run:'<circle cx="15" cy="4" r="1.6" fill="currentColor" stroke="none"/><path d="M9 21l2-5 3 2 3 4"/><path d="M6 15l3-3 3 1 3-4"/><path d="M13 7l-3 4 2 3"/>',
  chart:'<path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/>',
  shield:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>'
};
const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
const CROWN='<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="vertical-align:-1px"><path d="M4 8l4 3 4-6 4 6 4-3-1.5 9h-13z"/></svg>';

function homeScreen(){
  const bestG=boards.game[0], bestT=boards.three[0], bestA=boards.arizona[0], bestSh=boards.shuttle[0];
  const topLine=(m,best,fallback)=>best?`${CROWN} Top: ${esc(best.n)} ${fmtScore(m,best.s)}`:fallback;
  const modeCard=(cls,m,iconName,title,sub,best,fallback)=>`
    <button class="modeCard ${cls}" data-m="${m}">
      <span class="mc-icon">${icon(iconName)}</span>
      <span class="mc-body">
        <b class="mc-title">${title}</b>
        <small class="mc-sub">${sub}</small>
        <span class="mc-top">${topLine(m,best,fallback)}</span>
      </span>
      <span class="mc-chev">&rsaquo;</span>
    </button>`;
  card(`<h1>BucketSquad<span>Hoops</span></h1>
    <div class="ballDivider"><span></span>${icon("ball")}<span></span></div>
    <div class="nmWrap">
      <input id="nm" placeholder="Your name" maxlength="12" value="${esc(playerName)}">
      <span class="nmChev">&#9662;</span>
    </div>
    <div class="tagline"><span></span>Practice gets results<span></span></div>
    ${modeCard("game","game","stopwatch","2 on 1","60 seconds",bestG,"Pass, find the open man, score.")}
    ${modeCard("three","three","ball","3-Point Contest","60 seconds",bestT,"5 racks, money balls worth 2.")}
    ${modeCard("arizona","arizona","cone","Arizona Drill","60 seconds",bestA,"Full-court layups, makes and misses.")}
    ${modeCard("shuttle","shuttle","run","Shuttle Run","Race the clock",bestSh,"Full suicides, race 10 simulated teammates.")}
    <div class="row">
      <button class="util" id="lbBtn">${icon("chart")}<b>Leaderboard</b><span class="mc-chev">&rsaquo;</span></button>
      <button class="util" id="defBtn">${icon("shield")}<b>Defender</b><span class="toggleSw ${D.on?"on":""}"></span></button>
    </div>
    <div class="tagline"><span></span>Play harder every day<span></span></div>`);
  el("card").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
  el("lbBtn").onclick=()=>boardScreen("game");
  el("defBtn").onclick=e=>{ D.on=!D.on; e.currentTarget.querySelector(".toggleSw").classList.toggle("on",D.on); };
}

function boardScreen(m){
  const rows=boards[m];
  card(`<h1>Leaderboard</h1>
    <div class="tabs">
      <button class="tab ${m==="game"?"on":""}" data-b="game">2 on 1</button>
      <button class="tab ${m==="three"?"on":""}" data-b="three">3PT</button>
      <button class="tab ${m==="arizona"?"on":""}" data-b="arizona">Arizona</button>
      <button class="tab ${m==="shuttle"?"on":""}" data-b="shuttle">Shuttle</button>
    </div>
    <ol class="lb">${rows.length?rows.map((r,i)=>
      `<li><span class="pos">${i+1}</span><span class="who">${esc(r.n)}</span><span class="pts">${fmtScore(m,r.s)}</span></li>`).join("")
      :`<li class="empty">Nobody on the board yet.</li>`}</ol>
    <button class="play" id="back">Back</button>`);
  el("card").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>boardScreen(b.dataset.b));
  el("back").onclick=homeScreen;
}

function start(m){
  mode=m||"game";
  nameFromInput();
  score=0; run=0; timeLeft=MODES[mode].secs; ball=null; charging=false; power=0;
  stealCool=0; handler=0; shake=0; ripples=[]; dribT=.3;
  team[0].x=CW/2-6; team[0].y=30; team[0].vx=team[0].vy=0;
  team[1].x=CW/2+7; team[1].y=24;
  D.x=CW/2; D.y=19; D.slow=0;
  holding=false; moneyHeld=0;
  if(mode==="three"){ buildRacks(); activeRack=0; }
  if(mode==="arizona"){
    azLeg=0; azStep=0; azAttempts=0; mWp=0; mLeg=1;
    team[0].x=AZ_LEGS[0].start.x; team[0].y=AZ_LEGS[0].start.y;
    team[1].x=AZ_LEGS[mLeg].start.x; team[1].y=AZ_LEGS[mLeg].start.y; team[1].bob=0;
  }
  if(mode==="shuttle"){
    shuttleReset();
    team[0].x=SHUTTLE_LANES[5]; team[0].y=94;
  }
  el("runLabel").textContent=mode==="three"?"BALLS":mode==="arizona"?"TRIES":mode==="shuttle"?"LEG":"STREAK";
  el("pass").style.display=(mode==="three"||mode==="shuttle")?"none":"";
  el("shootWrap").style.display=mode==="shuttle"?"none":"";
  el("time").textContent=MODES[mode].secs;
  fill.setAttribute("stroke-dashoffset",289);
  if(band) band.setAttribute("stroke-dasharray","0 289");
  hud();
  el("overlay").classList.add("hide");
  playing=true; last=performance.now(); audio(); sfx.tip();
  say(mode==="three"?"SHOOT!":mode==="arizona"?"RUN!":"GO!");
}

async function gameOver(){
  sfx.horn();
  const perfect=mode==="three"&&score===34;
  if(mode==="shuttle"&&shStep<SHUTTLE_STOPS.length){
    gameOverCard("dnf",perfect);
    return;
  }
  if(playerName){
    const {ok,rank}=await saveScore(mode,playerName,score);
    gameOverCard(ok?rank:"failed",perfect);
  }else{
    gameOverCard(null,perfect);
  }
}
function gameOverCard(rank,perfect){
  const needsName=rank===null, failed=rank==="failed", dnf=rank==="dnf";
  const msg=needsName?"Enter your name to save this score."
    :dnf?"Time's up &mdash; didn't finish the run."
    :failed?"Couldn't save your score &mdash; check your connection."
    :rank===0?"Top of the board!"
    :rank>0?`#${rank+1} on the ${MODES[mode].label} board`
    :"Nice run.";
  card(`<h1>${mode==="three"?"Rack Over":"Time"}</h1>
    <div class="final">${dnf?"&mdash;":fmtScore(mode,score)}</div>
    <div class="sub">${msg}${perfect?" &middot; PERFECT 34!":""}</div>
    ${needsName?`<input id="nm" placeholder="Your name" maxlength="12">
    <button class="play" id="saveScore">Save score</button>`:`<button class="play" id="again">Play again</button>`}
    <div class="row">
      ${needsName?`<button class="link" id="skip">Skip</button>`:`<button class="link" id="lbBtn2">Leaderboard</button>`}
      <button class="link" id="menu">Change mode</button>
    </div>`);
  if(needsName){
    el("saveScore").onclick=async()=>{
      nameFromInput();
      const {ok,rank}=await saveScore(mode,playerName||"Player",score);
      gameOverCard(ok?rank:"failed",perfect);
    };
    el("skip").onclick=()=>start(mode);
  }else{
    el("again").onclick=()=>start(mode);
    el("lbBtn2").onclick=()=>boardScreen(mode);
  }
  el("menu").onclick=homeScreen;
}

el("mute").addEventListener("click",e=>{
  muted=!muted;
  e.currentTarget.classList.toggle("off",muted);
  e.currentTarget.innerHTML=muted?"&#128263;":"&#128266;";
  if(!muted){ audio(); sfx.dribble(); }
});
el("exit").addEventListener("click",()=>{
  playing=false; charging=false; ball=null;
  homeScreen();
});
addEventListener("resize",layout);
if(document.fonts) document.fonts.ready.then(layout);
layout(); loadBoards().then(homeScreen); requestAnimationFrame(frame);
</script>
